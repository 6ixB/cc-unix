name: Release

on:
  push:
    tags:
      - "v*-mc*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build resource pack
        run: npm run build

      - name: Rename ZIP to versioned filename
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}" # e.g. v1.0.0-mc1.21.1
          PACK="${TAG%%-mc*}"
          PACK="${PACK#v}"
          MC="${TAG##*-mc}"
          SRC="out/unix.zip"
          # Modrinth file convention uses +mc in the filename even though
          # the tag uses -mc (+ is invalid in GitHub tag filter patterns).
          DEST="out/unix-${PACK}+mc${MC}.zip"
          if [ ! -f "$SRC" ]; then
            echo "Expected build output not found: $SRC"
            exit 1
          fi
          mv "$SRC" "$DEST"
          echo "Built $DEST from tag $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/unix-*.zip
          generate_release_notes: true
